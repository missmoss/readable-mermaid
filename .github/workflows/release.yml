name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Validate sample artifacts
        run: npm run test:regression

      - name: Render smoke sample
        run: node ./src/cli.js ./samples/run-job-sequence.mmd

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build release artifacts
        run: npm run release:artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: readable-mermaid-release-bundle
          path: release/
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/readable-mermaid-*.tgz
            release/sbom.cyclonedx.json
            release/license-inventory.json
            release/license-inventory.md
            release/manifest.json
            release/SHA256SUMS
          generate_release_notes: true

